name: All
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  json-validator:
    name: JSON validator
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate JSON files
        run: |
          # Instance JSONs live in per-server subdirs (currently just epoch/) — recurse.
          while IFS= read -r f; do
            if ! jq -e '.' "$f" > /dev/null; then
              echo "$f is invalid"
              exit 1
            fi
            echo "$f is valid"
          done < <(find backend/instances -type f -name '*.json')
  frontend-types:
    name: Frontend Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "frontend"
    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Install dependencies
        run: "deno install"
      - name: Types
        run: "deno check src"
  frontend-formatting:
    name: Frontend Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "frontend"
    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Install dependencies
        run: "deno install"
      - name: Formatting
        run: "deno fmt --check src"
  backend-types:
    name: Backend Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "backend"
    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Install dependencies
        run: "deno install"
      - name: Types
        run: "deno check src"
      - name: Tests
        run: "deno test --allow-env ../tests/"
  backend-formatting:
    name: Backend Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "backend"
    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Install dependencies
        run: "deno install"
      - name: Formatting
        run: "deno fmt --check src"

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The image built from this commit, started with deploy/compose.yaml in its non-root, read-only shape.
      - name: Start the stack as the server runs it
        run: bash tests/container-smoke.sh

  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    needs: [frontend-types, frontend-formatting, backend-types, backend-formatting, json-validator, container]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          tags: "${{env.REGISTRY}}/defcons/softresio:latest"
          context: .
          push: true
