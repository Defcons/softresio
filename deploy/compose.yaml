services:
  softresio:
    image: ghcr.io/defcons/softresio:latest
    container_name: softresio
    restart: unless-stopped
    # Not root: the image's own `deno` user (uid 1993). The app only reads the image (code, static files, and the
    # module cache in DENO_DIR, filled when the image is built) and keeps its data in the database container, so the
    # filesystem is read-only and /tmp, a small RAM-backed tmpfs, is the only writable place.
    user: "1993:1993"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    ports:
      - "3015:8000"
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_USER: softres
      DOMAIN: softres.epoglogs.com
      SCHEME: https
      JWT_SECRET: ${JWT_SECRET}
      DISCORD_LOGIN_ENABLED: ${DISCORD_LOGIN_ENABLED:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Comma-separated Discord user IDs that get the site-wide admin panel.
      # Read by backend/src/config.ts; mirrors epoglogs's ADMIN_DISCORD_IDS.
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18
    container_name: softresio-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: softres
    volumes:
      - ./data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username softres"]
      interval: 1s
      timeout: 5s
      retries: 5
